version: 1
# Used when Amplify app root is set to `ui` (monorepo).
# Cognito comes from backend pipeline-deploy; no local sandbox required.
backend:
  phases:
    build:
      commands:
        - npm install --no-fund --no-audit --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - npm install --no-fund --no-audit --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
