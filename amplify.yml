version: 1
# Monorepo: Amplify app root = ui. Deploys Gen2 backend (Cognito) then Vite UI.
applications:
  - appRoot: ui
    backend:
      phases:
        build:
          commands:
            - npm install --no-fund --no-audit --cache .npm --prefer-offline
            - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
    frontend:
      phases:
        preBuild:
          commands:
            - npm install --no-fund --no-audit --cache .npm --prefer-offline
            # Ensure Cognito config exists for Amplify.configure (written by pipeline-deploy)
            - npx ampx generate outputs --branch $AWS_BRANCH --app-id $AWS_APP_ID
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - "**/*"
      cache:
        paths:
          - .npm/**/*
          - node_modules/**/*
