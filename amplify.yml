version: 1
# Repo-root monorepo config. Amplify Console app root should be `ui`.
# Static Vite build only (no Cognito / ampx backend yet).
applications:
  - appRoot: ui
    frontend:
      phases:
        preBuild:
          commands:
            - npm install --no-fund --no-audit --cache .npm --prefer-offline
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - "**/*"
      cache:
        paths:
          - .npm/**/*
          - node_modules/**/*
